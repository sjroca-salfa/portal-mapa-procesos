<style>
:root{--rojo:#B01E24;--burdeos:#5E0F13;--grafito:#1E2229;--gris:#5A6771;--linea:#D3D7DC;--fondo:#EEF0F2}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Barlow,Arial,sans-serif;color:var(--grafito);background:var(--fondo)}
.pt{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}
.pt-cab{display:flex;align-items:center;gap:24px;padding:0 32px 0 0;height:64px;background:linear-gradient(105deg,#1E2229 0%,#1E2229 48%,#5E0F13 86%,#7A1218 100%);color:#fff;border-top:4px solid var(--rojo)}
.pt-logo{height:100%;width:190px;background:#fff;display:flex;align-items:center;justify-content:center;padding-right:19px;clip-path:polygon(0 0,100% 0,calc(100% - 19px) 100%,0 100%)}
.pt-logo img{width:120px}
.pt-cab h1{font:800 20px Montserrat,sans-serif;letter-spacing:.3px}
.pt-yo{margin-left:auto;text-align:right;font-size:13px;line-height:1.3}
.pt-yo b{display:block;font:600 14px Montserrat,sans-serif}
.pt-yo a{color:#F2C2C4}
.pt-cu{width:100%;max-width:980px;margin:0 auto;padding:40px 24px}
.pt-cu h2{font:700 26px Montserrat,sans-serif;margin-bottom:6px}
.pt-cu > p{color:var(--gris);font-size:16px;margin-bottom:28px}
.tarjeta{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:#fff;border-left:6px solid var(--rojo);padding:22px 24px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.tarjeta h3{font:700 20px Montserrat,sans-serif}
.tarjeta .meta{margin-top:6px;color:var(--gris);font-size:14.5px;line-height:1.5}
.chip{display:inline-block;padding:2px 9px;font:700 11.5px Barlow,sans-serif;letter-spacing:.8px;text-transform:uppercase;background:#E3E5E8;color:#3A414A;margin-right:6px}
.chip.ok{background:#1E2229;color:#fff}.chip.rojo{background:var(--rojo);color:#fff}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:1.5px solid #3A414A;background:#3A414A;color:#fff;font:600 15px Barlow,sans-serif;letter-spacing:1.2px;text-transform:uppercase;text-decoration:none;cursor:pointer}
.bt.pri{background:var(--rojo);border-color:var(--rojo)}
.bt.sec{background:#fff;color:#1E2229}
.bt:hover{filter:brightness(1.1)}
.acciones{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.caja{background:#fff;padding:18px 20px;border:1px solid var(--linea)}
.caja h4{font:700 15px Montserrat,sans-serif;margin-bottom:8px}
.caja p,.caja li{font-size:14.5px;line-height:1.5;color:#3A414A}
.caja ul{padding-left:18px}
.form label{display:block;font:600 12px Barlow,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--gris);margin:12px 0 4px}
.form input,.form textarea{width:100%;padding:9px 10px;border:1.5px solid #C9CDD2;font:inherit;font-size:15px}
.msg{margin-top:12px;font-size:14.5px}.msg.err{color:var(--rojo)}.msg.ok{color:#146A38}
.pt-pie{padding:12px 32px;background:#3A414A;color:#fff;font:600 12px Barlow,sans-serif;letter-spacing:2px;text-transform:uppercase}
@media (max-width:640px){.tarjeta{grid-template-columns:1fr}.pt-logo{width:130px}.pt-logo img{width:86px}.pt-cab h1{font-size:15px}.pt-yo{display:none}}
</style>

    <div class="pt-yo" id="yo"></div>

<script>
(function(){
  var C=window.__CTX||{},S=C.sesion||{},D=C.datos||{};
  function $(i){return document.getElementById(i)}
  function el(t,c,tx){var e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e}
  var cambiar='https://accounts.google.com/AccountChooser?continue='+encodeURIComponent(S.url||'');
  var yo=$('yo');
  var b=el('b',null,S.email||'Sin sesión');yo.appendChild(b);
  yo.appendChild(document.createTextNode((S.perfil?'Perfil: '+S.perfil+(S.simulado?' (simulado)':''):'Sin acceso asignado')+' · '));
  var a=el('a',null,'Cambiar de cuenta');a.href=cambiar;a.target='_top';yo.appendChild(a);

  var cu=$('cu');
  cu.appendChild(el('h2',null,'Hola'+(S.nombre?', '+S.nombre.split(' ')[0]:'')));
  if(!S.dominioOk){
    cu.appendChild(el('p',null,'Entraste con '+(S.email||'una cuenta no identificada')+'. Este portal es solo para cuentas corporativas de Salfa Montajes.'));
    var bx=el('a','bt pri','Entrar con mi cuenta Salfa');bx.href=cambiar;bx.target='_top';cu.appendChild(bx);
    return;
  }
  if(!S.perfil){
    cu.appendChild(el('p',null,'Tu cuenta Salfa está verificada, pero aún no tienes un perfil asignado en este portal.'));
    var caja=el('div','caja form');
    caja.appendChild(el('h4',null,D.pendiente?'Tu solicitud está pendiente':'Solicitar acceso'));
    if(D.pendiente){caja.appendChild(el('p',null,'La persona administradora ya recibió tu solicitud. Te avisaremos por correo.'))}
    else{
      var l1=el('label',null,'Área o cargo');var i1=el('input');i1.maxLength=120;
      var l2=el('label',null,'¿Para qué necesitas el acceso?');var i2=el('textarea');i2.rows=3;i2.maxLength=500;
      var m=el('p','msg');var bs=el('button','bt pri','Enviar solicitud');bs.type='button';bs.style.marginTop='14px';
      bs.onclick=function(){bs.disabled=true;m.className='msg';m.textContent='Enviando…';
        google.script.run.withSuccessHandler(function(r){m.className='msg ok';m.textContent=r;bs.remove()})
          .withFailureHandler(function(e){m.className='msg err';m.textContent=e.message;bs.disabled=false})
          .api_solicitarAcceso(i1.value,i2.value)};
      [l1,i1,l2,i2,bs,m].forEach(function(x){caja.appendChild(x)});
    }
    cu.appendChild(caja);
    return;
  }
  cu.appendChild(el('p',null,'Elige un portal. Cada portal guarda sus versiones en Drive y registra quién hizo cada cambio.'));
  var t=el('section','tarjeta');var izq=el('div');
  izq.appendChild(el('h3',null,S.portal||'Mapa de Procesos'));
  var mt=el('div','meta');
  if(D.vigente){
    var c1=el('span','chip ok','Vigente: Rev '+S.revVigente);mt.appendChild(c1);
    mt.appendChild(document.createTextNode('Documento '+(S.documento||'')+' · aprobada el '+D.vigente.fecha));
  }
  if(D.trabajo){mt.appendChild(el('br'));var c2=el('span','chip rojo',D.trabajo.estadoNombre);mt.appendChild(c2);
    mt.appendChild(document.createTextNode('En trabajo: '+D.trabajo.etiqueta+' · '+D.trabajo.autor+' · '+D.trabajo.fecha))}
  izq.appendChild(mt);t.appendChild(izq);
  var acc=el('div','acciones');
  var b1=el('a','bt pri','Abrir el mapa');b1.href=S.url+'?p=mapa';b1.target='_top';acc.appendChild(b1);
  if(S.permisos&&S.permisos.admin){var b2=el('a','bt','Administración');b2.href=S.url+'?p=admin';b2.target='_top';acc.appendChild(b2)}
  if(S.gemUrl){var b3=el('a','bt sec','Asistente Gemini');b3.href=S.gemUrl;b3.target='_blank';b3.rel='noopener';acc.appendChild(b3)}
  t.appendChild(acc);cu.appendChild(t);

  var g=el('div','grid2');
  var p1=el('div','caja');p1.appendChild(el('h4',null,'Tu perfil: '+S.perfil));
  var ul=el('ul');var P=S.permisos||{};
  [['ver','Ver la revisión vigente, la guía y el comparador'],['borradores','Ver versiones en trabajo'],['editar','Editar el mapa en pantalla'],['proponer','Guardar propuestas de cambio'],['guardar','Guardar borradores oficiales y enviarlos a revisión'],['revisar','Validar o devolver versiones'],['aprobar','Aprobar y publicar revisiones'],['admin','Administrar accesos y configuración']]
    .forEach(function(x){if(P[x[0]])ul.appendChild(el('li',null,x[1]))});
  p1.appendChild(ul);g.appendChild(p1);
  var p2=el('div','caja');p2.appendChild(el('h4',null,'Cómo funciona'));
  p2.appendChild(el('p',null,'Cada guardado crea una versión en Drive con autor, fecha y comentario. Una versión pasa por revisión y validación antes de aprobarse; solo la aprobación cambia la revisión vigente.'));
  g.appendChild(p2);cu.appendChild(g);
})();
</script>
